<!DOCTYPE html>
<html>
<body>

<h2>Student Details</h2>

<button onclick="getStudent()">
    Load Student
</button>

<div id="output"></div>

<script>

async function getStudent(){

    const response =
    await fetch(
        "https://jsonplaceholder.typicode.com/users/1"
    );

    const data =
    await response.json();

    document.getElementById("output")
    .innerHTML = `
        Name : ${data.name}<br>
        Email : ${data.email}<br>
        City : ${data.address.city}
    `;
}

</script>

</body>
</html>
