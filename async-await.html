<!DOCTYPE html>
<html>
<body>

<script>

function getStudent(){

    return new Promise(function(resolve){
          console.log("Loading Promise...");

        setTimeout(function(){
              console.log("Loading SetTimeout...");

            resolve("Arun");

        },3000);

    });

}

async function displayStudent(){

    console.log("Loading Student...");

    let student = await getStudent();
      console.log("Assigned Value...");

    console.log(student);

}

displayStudent();

</script>
