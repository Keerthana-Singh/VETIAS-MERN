<!DOCTYPE html>
<html>
<body>

<h2>Student Data</h2>

<button onclick="loadData()">
    Load Student
</button>

<p id="result"></p>

<script>

function loadData(){

    fetch(
        "https://jsonplaceholder.typicode.com/users/1"
    )
    .then(response => response.json())
    .then(data => {

        document.getElementById("result")
        .textContent =
        "Student Name : " + data.name;

    });

}

</script>

</body>
</html>
